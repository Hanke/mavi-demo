name: mavi

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mavi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mavi}
      POSTGRES_DB: ${POSTGRES_DB:-mavi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mavi} -d ${POSTGRES_DB:-mavi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: ./ai
      additional_contexts:
        infra: ./infra
    environment:
      TAXONOMY_PATH: /app/infra/taxonomy.json
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mavi}:${POSTGRES_PASSWORD:-mavi}@db:5432/${POSTGRES_DB:-mavi}
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      - ./ai/app:/app/app
      - ./infra:/app/infra:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      additional_contexts:
        infra: ./infra
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-mavi}:${POSTGRES_PASSWORD:-mavi}@db:5432/${POSTGRES_DB:-mavi}?sslmode=disable
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
      TAXONOMY_PATH: /app/infra/taxonomy.json
      # Background job worker embedded in the API process (0 disables it; see `make worker`).
      # WORKER_ID is left to its default (container hostname + pid) so scaled replicas stay distinct.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Migrations and seeds are read at runtime, so `make migrate` / `make seed`
      # pick up edits without rebuilding the image.
      - ./infra:/app/infra:ro
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  web_node_modules:
