[project]
name = "mavi-ai"
version = "0.1.0"
description = "Mavi AI service: embeddings and LLM calls behind a FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
