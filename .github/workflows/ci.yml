name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No provider credentials in CI: the AI service runs its key-free local
# embedding stub and its fake LLM provider, and the test suites never call a
# real model.
env:
  LLM_PROVIDER: fake
  EMBEDDING_PROVIDER: local
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

jobs:
  go:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # Most of the API's tests need a database (internal/dbtest) and skip
    # without one, so one is provided: the same image as docker-compose.yml.
    # Each test creates and drops a database of its own in it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mavi
          POSTGRES_PASSWORD: mavi
          POSTGRES_DB: mavi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mavi -d mavi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mavi:mavi@localhost:5432/mavi?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        # The smoke tag brings the compose smoke test (internal/e2e) into the build.
        run: go vet -tags smoke ./...
      - name: go test
        run: go test ./...
      - name: The database tests ran
        # A test that cannot reach the database skips, and a skip is green.
        run: |
          skipped="$(go test ./internal/db/ ./internal/jobs/ ./internal/server/ ./internal/tasks/ ./internal/e2e/ -v 2>&1 | grep -c -e '--- SKIP' || true)"
          if [ "$skipped" != "0" ]; then echo "$skipped tests were skipped: the database tests did not run"; exit 1; fi

  smoke:
    name: Smoke test (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      # Builds and starts db, ai and api as docker-compose.yml defines them,
      # with the fake LLM and an empty database, and drives one role from
      # resume upload to release over HTTP (api/internal/e2e/smoke_test.go).
      # On a failure it prints the api and ai logs before removing the stack.
      - name: make smoke
        run: make smoke

  python:
    name: Python AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pyright
        run: pyright
      - name: pytest
        run: pytest -q

  contracts:
    name: Generated contracts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r ai/requirements-dev.txt
          npm --prefix web ci
      # Regenerates ai/openapi.json, the Go types and the web types from the
      # specs and fails when any of them was committed stale.
      - name: make check-contracts
        run: make check-contracts PYTHON=python

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
