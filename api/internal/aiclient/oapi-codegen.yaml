# oapi-codegen config for ai/openapi.json (exported from the FastAPI app) -> types.gen.go.
# oapi-codegen is pinned as a tool in api/go.mod. v2.7.x is the last line that builds with
# Go 1.24 (v2.8 requires Go 1.25), which is what the Dockerfile and README commit to.
package: aiclient
output: types.gen.go
generate:
  models: true
output-options:
  skip-prune: true
  name-normalizer: ToCamelCaseWithInitialisms
  # Nullable fields stay pointers so a JSON null decodes. The exporter marks
  # the list fields, which Pydantic never emits as null, to skip the pointer.
compatibility:
  always-prefix-enum-values: true
