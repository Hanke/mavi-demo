# Contract for the Go API (api/). This file is the single definition of the
# shapes the web app and the API exchange.
#
#   api/internal/contract/types.gen.go   Go types, generated by oapi-codegen;
#                                        the store and handlers use them directly
#   web/src/api/schema.d.ts              TypeScript types, generated by openapi-typescript;
#                                        the web client is typed from them
#
# Edit this file, then run `make generate`. `make check-contracts` fails when a
# generated file is stale, and either build fails where code no longer matches.
#
# Vendor extensions:
#   x-roles       which personas may call the operation (talent / employer / ops);
#                 api/internal/server checks this list against its route table
#   x-go-type     the hand-written Go type a schema maps to (see contract.go)
#   x-go-type-skip-optional-pointer
#                 optional slices and raw JSON are plain values in Go, not pointers
openapi: 3.0.3
info:
  title: Mavi API
  version: 0.1.0
  description: |
    JSON CRUD for candidates, their profiles, roles and matches. Every request
    outside `/health` names a persona with the `X-Role` header (`talent`,
    `employer` or `ops`) and may identify itself with `X-Actor` (the candidate
    id for talent, an email for ops). A missing or unknown role is a 401; a
    known role calling an operation it may not use is a 403.

    `PUT` on candidates and roles replaces the fields you send and keeps the
    rest; an explicit `null` clears an optional field and is a 422 on a
    required one. `PUT …/profile` replaces the whole profile. Taxonomy fields
    (certifications, software) accept free text and are stored as canonical
    ids from infra/taxonomy.json; an unknown value is a 422.
servers:
  - url: http://localhost:8080

security:
  - role: []

tags:
  - name: health
  - name: candidates
  - name: profiles
  - name: availability
  - name: roles
  - name: matching
  - name: review
  - name: matches
  - name: jobs

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness of the API and its dependencies
      security: []
      responses:
        "200":
          description: Postgres and the AI service are both reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: At least one dependency failed; `checks` names it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  # ---------------------------------------------------------------------------
  # Candidates
  # ---------------------------------------------------------------------------
  /candidates:
    post:
      tags: [candidates]
      operationId: createCandidate
      summary: Create a candidate
      description: "Talent-created candidates are marked `source: self` unless a source is given."
      x-roles: [talent, ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [candidates]
      operationId: listCandidates
      summary: List candidates
      x-roles: [ops]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CandidateStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Candidate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /candidates/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [candidates]
      operationId: getCandidate
      summary: Fetch a candidate
      description: Talent may only read their own record (`X-Actor` = id); another id is a 404.
      x-roles: [talent, ops]
      responses:
        "200":
          description: The candidate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [candidates]
      operationId: updateCandidate
      summary: Update a candidate
      description: Replaces the fields sent and keeps the rest. Talent may only update their own record.
      x-roles: [talent, ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [candidates]
      operationId: deleteCandidate
      summary: Delete a candidate
      x-roles: [ops]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /candidates/{id}/profile:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Fetch a candidate's structured profile
      x-roles: [talent, ops]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [profiles]
      operationId: putProfile
      summary: Create or replace a candidate's profile
      description: |
        Replaces the whole profile. Omitted lists become empty and an omitted
        availability becomes `unknown`. Re-saving identical content keeps the
        stored embedding; a change to the text it was derived from clears it.
      x-roles: [talent, ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Replaced an existing profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "201":
          description: Created the candidate's first profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [profiles]
      operationId: deleteProfile
      summary: Delete a candidate's profile
      x-roles: [ops]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /candidates/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [profiles]
      operationId: uploadResume
      summary: Upload a resume and queue its parsing
      description: |
        Talent intake. The request body is the file itself (not multipart): a
        PDF, or a DOCX. What the file is is read from its content, not from
        `Content-Type`. Its text is extracted in the request and stored as the
        candidate's `resume_text`, and a `parse_resume` job is queued; the
        response is that job, whose `id` is what to poll. The worker sends the
        text to the AI service's `/parse-resume`, writes the result as the
        candidate's profile (replacing any profile already there) and embeds
        it. Poll `GET /candidates/{id}/resume/job` (or, as ops,
        `GET /jobs/{id}`) until `status` is `succeeded`, then read
        `GET /candidates/{id}/profile`.

        Uploading again while the job is still queued replaces the text and
        returns the same job. Talent may only upload to their own record.
      x-roles: [talent, ops]
      requestBody:
        required: true
        description: The file itself, at most 5 MB and 10 pages.
        content:
          application/pdf:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: Text extracted and stored; the parse is queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: The file is larger than 5 MB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The file is neither a PDF nor a DOCX.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The file is empty, damaged, password-protected, has no text, or has too many pages or too much text; `error` says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The AI service, which reads the file, is unavailable. Nothing was stored; try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /candidates/{id}/resume/job:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [profiles]
      operationId: getResumeJob
      summary: Status of the candidate's most recent resume parse
      description: |
        The newest `parse_resume` job for the candidate: the same object
        `GET /jobs/{id}` returns, readable by the talent who uploaded. The
        profile is ready when `status` is `succeeded`; on `failed`,
        `last_error` says why. A 404 when no resume was ever uploaded.
      x-roles: [talent, ops]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /candidates/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [availability]
      operationId: getAvailability
      summary: Fetch what the candidate said about when and where they can work
      description: A 404 until the candidate has supplied it; such a candidate is excluded from matching.
      x-roles: [talent, ops]
      responses:
        "200":
          description: The candidate's availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkAvailability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [availability]
      operationId: putAvailability
      summary: Set or edit the candidate's time zone, working hours, hours per week and start date
      description: |
        Availability and time-zone overlap are hard filters that a resume
        cannot answer, so the candidate supplies them, here. All four are
        required and the body replaces whatever was stored. Parsing a resume
        (again) never changes them. Talent may only set their own.
      x-roles: [talent, ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkAvailabilityInput" }
      responses:
        "200":
          description: Replaced what was stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkAvailability" }
        "201":
          description: Stored for the first time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkAvailability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------------------
  # Roles
  # ---------------------------------------------------------------------------
  /roles:
    post:
      tags: [roles]
      operationId: createRole
      summary: Create a role
      x-roles: [employer, ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles
      description: Talent only ever receives open roles; a `status` filter other than `open` returns an empty list for talent.
      x-roles: [talent, employer, ops]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RoleStatus" }
        - name: company
          in: query
          description: Exact match.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /roles/intake:
    post:
      tags: [roles]
      operationId: intakeRole
      summary: Create a role from a pasted job description and queue its matching run
      description: |
        Employer intake. The AI service's `/parse-jd` reads the job description
        in the request and the role is stored with the raw text as
        `description`, the whole extraction as `requirements`, and the
        must-haves, nice-to-haves and hard-filter requirements in their own
        fields, so the response shows the employer what was understood. The
        role is embedded before the answer (from the structured requirements,
        through `/embed-batch`, as an `embed_role` job would), and a
        `match_role` job is queued for it: the matching run, which reranks the
        candidates who pass the role's filters and writes them to the role's
        matches, the best of them as `pending_review` for ops. None of them is
        visible to the employer until ops releases it.

        The parse is a chat-model call, so the request can take a while. If
        only the embedding fails the role is still created: `embedded_at` is
        `null` in the response and an `embed_role` job fills it in later.
        Correct anything the parser got wrong with `PUT /roles/{id}`.
      x-roles: [employer, ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleIntakeInput" }
      responses:
        "201":
          description: The role as stored, and its matching job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleIntake" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: |
            `description` is missing, blank or longer than the parser accepts; or the job
            description names no title and none was sent (`fields.title`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The AI service, which parses the job description, is unavailable or its model's output did not validate. Nothing was stored; try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /roles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [roles]
      operationId: getRole
      summary: Fetch a role
      description: A role that is not open is a 404 for talent.
      x-roles: [talent, employer, ops]
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [roles]
      operationId: updateRole
      summary: Update a role
      description: Replaces the fields sent and keeps the rest. Changing the description clears the stored embedding.
      x-roles: [employer, ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [roles]
      operationId: deleteRole
      summary: Delete a role
      x-roles: [employer, ops]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /roles/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [availability]
      operationId: listRoleAvailability
      summary: Which active candidates pass the role's availability and time-zone filters
      description: |
        One entry per active candidate, by name, each with whether it passes
        and, when it does not, why. A candidate who has not supplied their
        availability never passes, whatever the role asks for. Otherwise the
        candidate must be able to start by `starts_on`, offer at least the
        role's `hours_per_week`, and have working hours that cover at least
        `min_overlap_hours` of the role's working day (09:00 to 17:00 in the
        role's `timezone`, on the role's `starts_on`, or on the day of the
        request when it has none). A requirement the role leaves null is not
        checked.
      x-roles: [ops]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Active candidates by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailabilityCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles/{id}/filter-runs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [matching]
      operationId: runRoleFilters
      summary: Run the role's hard filters over the pool and record how it narrowed
      description: |
        The first stage of a matching run, as one SQL statement. The pool is
        the active candidates; each filter in turn drops the candidates who
        miss one of the role's must-haves, and only those left after the last
        (`candidate_ids`) may reach a later stage:

        1. `profile`: has a parsed profile.
        2. `certifications`: holds every required qualification, or, where the
           requirement accepts equivalents (`requirements.required_qualifications`;
           the default when it does not say), one the taxonomy treats as
           equivalent.
        3. `software`: lists all of `required_software`.
        4. `experience`: has at least `min_years_experience`; a profile with no
           figure does not pass.
        5. `availability`: has supplied their availability, can start by
           `starts_on` and offers at least `hours_per_week`.
        6. `timezone_overlap`: their working hours cover at least
           `min_overlap_hours` of the role's working day (09:00 to 17:00 in the
           role's `timezone`, on `overlap_on`).

        A requirement the role leaves empty or null drops nobody, except that
        a candidate with no profile or no availability never passes. The run
        is stored and logged, with the number of candidates left after each
        filter.

        The same statement then retrieves the shortlist for the rerank: those
        who passed, ordered by the cosine similarity of their profile's
        embedding to the role's, nearest first, cut to `retrieval_limit`
        (`retrieved`). When fewer passed than the limit, all of them are
        retrieved. A candidate whose profile is not embedded yet, or was
        embedded by a different provider than the role, cannot be compared and
        is listed in `unranked_ids` instead. While the role itself has no
        embedding (`role_embedded` is false) that is everyone who passed.
      x-roles: [ops]
      responses:
        "201":
          description: The recorded run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilterRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [matching]
      operationId: listRoleFilterRuns
      summary: The recorded runs of the role's hard filters, newest first
      x-roles: [ops]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FilterRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles/{id}/match-status:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [matching]
      operationId: getRoleMatchStatus
      summary: Where the role's matching stands
      description: |
        The pipeline promises two profiles. A role is `ready` once two matches
        are released, and `in_review` until then.

        A matching run that cannot deliver two still completes, as
        `needs_attention`, and ops sees that here with the run (`run`): why
        (`attention_reason`), how the pool narrowed (`stages`) and the
        must-have that eliminated the most candidates (`top_filter`).

        - `too_few_passed`: zero or one candidate passed the hard filters.
        - `too_few_qualified`: fewer than two of the reranked scored at or
          above the minimum (`min_score`). A candidate below it is written as
          `proposed` and never put in the review queue to make up the number.
        - `ai_failed`: the AI service failed or timed out during the rerank.
          No matches were written, and the job is retried while it has
          attempts left; a retry that succeeds is a new run.

        An employer is told `in_review` in every one of those cases, with no
        run: they see a role being worked on, never a weak match.
      x-roles: [employer, ops]
      responses:
        "200":
          description: The role's matching status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleMatchStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Review: ops decides on a role's matches and releases two to the employer.
  # Every decision is a review event, written with the change it records.
  # ---------------------------------------------------------------------------
  /roles/{id}/review-queue:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [review]
      operationId: getReviewQueue
      summary: The role's matches under review
      description: |
        What ops has to decide on for the role, and what it has decided:
        `pending` is the queue (`pending_review`), `approved` the candidates
        approved so far, both best first. `next` is the next ranked candidate,
        the one `POST /matches/{id}/swap` would bring into the queue.
      x-roles: [ops]
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /roles/{id}/release:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [review]
      operationId: releaseRole
      summary: Release the role's two approved candidates to the employer
      description: |
        The only way a match becomes visible to the employer. It is refused
        (409) unless exactly two of the role's matches are `approved`: with
        fewer there are not two profiles to show, and with more ops has not
        said which two. It is also refused while a match that is not approved
        is still released. Nothing changes when it is refused.

        It sets `released_at` on the two and records a `release` review event
        for each with the `X-Actor` value. Releasing a role whose two are
        already released is a no-op.
      x-roles: [ops]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: The two released matches, best first; what the employer now sees for the role.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /roles/{id}/review-events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [review]
      operationId: listReviewEvents
      summary: The audit trail of review decisions on the role's matches
      description: >-
        Every approve, reject, swap, release and unrelease on a match of the role, with who did it
        (`actor`) and when. Events are never edited or deleted, and a match that has one cannot be deleted.
      x-roles: [ops]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Events, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Matches
  # ---------------------------------------------------------------------------
  /matches:
    post:
      tags: [matches]
      operationId: createMatch
      summary: Propose a match between a role and a candidate
      description: >-
        A candidate who has not supplied their availability (`PUT /candidates/{id}/availability`) cannot be
        matched; that is a 422 on `candidate_id`. A match is created undecided (`proposed`, or `pending_review`
        to put it in the review queue); any other `status` is a 422.
      x-roles: [ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchCreate" }
      responses:
        "201":
          description: Created, unreleased.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [matches]
      operationId: listMatches
      summary: List matches
      description: |
        Ops sees every match. Employers see released matches only. Talent sees
        released matches for their own candidate only (`X-Actor` = candidate id);
        a `candidate_id` filter naming someone else returns an empty list.
      x-roles: [talent, employer, ops]
      parameters:
        - name: role_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: candidate_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MatchStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Grouped by role, best score first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /matches/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [matches]
      operationId: getMatch
      summary: Fetch a match
      description: An unreleased match is a 404 for employers and talent, never a 403.
      x-roles: [talent, employer, ops]
      responses:
        "200":
          description: The match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [matches]
      operationId: updateMatch
      summary: Edit a match's score, explanation or breakdown
      description: >-
        The (role, candidate) pair is immutable; sending `role_id` or `candidate_id` is a 422. So is sending
        `status`: a decision is made through the review operations, which record who made it.
      x-roles: [ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [matches]
      operationId: deleteMatch
      summary: Delete a match
      description: A match with review history cannot be deleted (409).
      x-roles: [ops]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /matches/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [review]
      operationId: approveMatch
      summary: Approve a candidate for the role
      description: |
        Sets the match to `approved` and records an `approve` review event with
        the `X-Actor` value. The match must be undecided (`pending_review`, or
        `proposed`); one that was rejected or swapped out is a 409. Approving an
        approved match is a no-op. Approving does not show the employer anything:
        that is `POST /roles/{id}/release`, once exactly two are approved.
      x-roles: [ops]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: The match after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /matches/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [review]
      operationId: rejectMatch
      summary: Turn a candidate down, with nobody brought in
      description: |
        Sets the match to `rejected` and records a `reject` review event. It is
        how an approval is taken back, and how a candidate leaves the queue when
        there is nobody to swap in. The match must be undecided or approved, and
        not released (withdraw it first); one that was swapped out is a 409.
        Rejecting a rejected match is a no-op.
      x-roles: [ops]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: The match after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /matches/{id}/swap:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [review]
      operationId: swapMatch
      summary: Swap a candidate out for the next ranked one
      description: |
        Takes a candidate out of review and brings in the next ranked: the match
        becomes `swapped`, and the role's best `proposed` match becomes
        `pending_review`, where it waits for a decision like any other. One
        `swap` review event records both, with the candidate brought in as
        `replacement_candidate_id`.

        The next ranked candidate is the highest scoring `proposed` match of the
        role whose candidate is still active and who scores the minimum
        (`MATCH_MIN_SCORE`) or more; it is `next` in `GET /roles/{id}/review-queue`.
        A weak candidate is not brought in to make up the number: with nobody in
        reserve the swap is a 409 and nothing changes.

        The match must be in review (`pending_review` or `approved`) and not
        released; anything else is a 409.
      x-roles: [ops]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: The match swapped out and the one brought in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwapResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /matches/{id}/unrelease:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [review]
      operationId: unreleaseMatch
      summary: Withdraw a released match
      description: |
        Clears `released_at`, so the employer no longer sees the match, and
        records an `unrelease` review event. The match stays `approved`. A no-op
        on a match that is not released.
      x-roles: [ops]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: The match after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Enqueue a background job
      description: |
        Adds a job to the Postgres-backed queue. `kind` must be one the worker
        has a handler for (`embed_role`, `embed_profile`, `parse_resume`); anything else is a
        422 naming the known kinds. If an identical job (same `kind` and
        `payload`) is already queued, that job is returned with a 200 instead
        of adding a duplicate. The worker picks the job up within its poll
        interval; poll `GET /jobs/{id}` until `status` is `succeeded` or `failed`.
      x-roles: [ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
      responses:
        "201":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "200":
          description: An identical job was already queued; it is returned instead of a duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List background jobs
      x-roles: [ops]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JobStatus" }
        - name: kind
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get a background job
      description: What the UI polls. A job is finished when `status` is `succeeded` or `failed`; a failed job carries the last attempt's error in `last_error`.
      x-roles: [ops]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    role:
      type: apiKey
      in: header
      name: X-Role
      description: A `Persona` (`talent`, `employer` or `ops`). The `mavi_role` cookie is a session fallback.
    actor:
      type: apiKey
      in: header
      name: X-Actor
      description: >-
        The candidate id for talent (required for talent to read anything), an email for ops (required for
        the review operations, whose audit trail records it).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    JobId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/JobId" }
    Limit:
      name: limit
      in: query
      description: Page size; default 50, max 200.
      schema: { type: integer, minimum: 1, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }

  responses:
    BadRequest:
      description: Malformed JSON or an unknown field.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or unknown `X-Role`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        The role may not call this operation, a talent request is missing its candidate id, or a review
        operation is missing its reviewer (`X-Actor`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such row, or one the caller may not see.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >-
        A unique constraint (duplicate email, duplicate role/candidate pair), a delete blocked by history, or a
        review operation the role's matches do not allow as they stand (`error` says why; nothing was changed).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: One or more fields are invalid; `fields` maps each to a message.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # -- primitives -----------------------------------------------------------
    Id:
      type: string
      description: A UUID, as text.
      example: 11111111-0000-0000-0000-000000000001
    JobId:
      type: integer
      format: int64
      description: A job's id. Jobs are numbered from a sequence, not UUIDs.
      example: 42
    CalendarDate:
      type: string
      format: date
      description: A calendar day, `YYYY-MM-DD`.
      example: "2026-10-14"
      x-go-type: Date
    JSONObject:
      type: object
      description: A free-form JSON object stored as JSONB.
      additionalProperties: true
      x-go-type: RawJSON
    CandidateStatus:
      type: string
      enum: [active, archived]
    RoleStatus:
      type: string
      enum: [open, filled, closed]
    MatchStatus:
      type: string
      description: >-
        `pending_review` is the review queue: the top of a matching run's ranking, waiting for an ops decision.
        `proposed` is a match nobody has decided on that is not in the queue: the rest of what a run scored, or
        one ops wrote by hand. `approved`, `rejected` and `swapped` are ops' decisions, made through the review
        operations. None of them says anything about what the employer sees; that is `released_at`.
      enum: [proposed, pending_review, approved, rejected, swapped]
    JobStatus:
      type: string
      description: "`queued` → `running` → `succeeded`, or `running` → `queued` (retry) → … → `failed`."
      enum: [queued, running, succeeded, failed]
    Availability:
      type: string
      description: What the resume suggests. The filters use `WorkAvailability`, which the candidate supplies.
      enum: [immediate, two_weeks, one_month, unavailable, unknown]
    ClockTime:
      type: string
      description: A time of day on a 24-hour clock, `HH:MM`.
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      example: "09:00"
    HealthStatus:
      type: string
      enum: [ok, degraded]
    Persona:
      type: string
      description: The value of the `X-Role` header. Each operation's `x-roles` lists the personas that may call it.
      enum: [talent, employer, ops]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: validation failed
        fields:
          type: object
          description: Per-field messages on a 422.
          additionalProperties: { type: string }

    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        checks:
          type: object
          description: "One entry per dependency (`postgres`, `ai`): `ok` or `error: <message>`."
          additionalProperties: { type: string }

    # -- candidates -----------------------------------------------------------
    Candidate:
      type: object
      required: [id, full_name, email, phone, location, resume_text, source, status, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        full_name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        location: { type: string, nullable: true }
        resume_text: { type: string }
        source:
          type: string
          nullable: true
          description: Where the record came from; `self` when talent created it.
        status: { $ref: "#/components/schemas/CandidateStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CandidateInput:
      type: object
      description: |
        Body for creating or updating a candidate. Every field is optional on
        the wire so a `PUT` can send only what changes; `full_name` is required
        when creating and may not be nulled. `null` clears an optional field.
      properties:
        full_name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        location: { type: string, nullable: true }
        resume_text:
          type: string
          nullable: true
          description: "`null` clears it to an empty string."
        source: { type: string, nullable: true }
        status:
          allOf: [{ $ref: "#/components/schemas/CandidateStatus" }]
          description: Defaults to `active` on create.

    # -- profiles -------------------------------------------------------------
    Profile:
      type: object
      description: One structured profile per candidate, with the hard-filter columns promoted out of the JSON.
      required:
        [id, candidate_id, profile, headline, years_experience, certifications, software, availability,
         available_from, timezone, embedding_model, embedded_at, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        candidate_id: { $ref: "#/components/schemas/Id" }
        profile:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          description: The parser's structured extraction (the AI service's `CandidateProfile`).
        headline: { type: string, nullable: true }
        years_experience: { type: integer, nullable: true, minimum: 0, maximum: 70 }
        certifications:
          type: array
          description: Canonical taxonomy ids.
          items: { type: string }
        software:
          type: array
          description: Canonical taxonomy ids.
          items: { type: string }
        availability: { $ref: "#/components/schemas/Availability" }
        available_from:
          allOf: [{ $ref: "#/components/schemas/CalendarDate" }]
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA zone name.
        embedding_model: { type: string, nullable: true }
        embedded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProfileInput:
      type: object
      description: Body for `PUT …/profile`. Taxonomy lists accept free text and are stored as canonical ids.
      properties:
        profile:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          x-go-type-skip-optional-pointer: true
        headline: { type: string, nullable: true }
        years_experience: { type: integer, nullable: true, minimum: 0, maximum: 70 }
        certifications:
          type: array
          items: { type: string }
          x-go-type-skip-optional-pointer: true
        software:
          type: array
          items: { type: string }
          x-go-type-skip-optional-pointer: true
        availability:
          allOf: [{ $ref: "#/components/schemas/Availability" }]
          description: Defaults to `unknown`.
        available_from:
          allOf: [{ $ref: "#/components/schemas/CalendarDate" }]
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA zone name, e.g. `America/Chicago`.

    # -- availability ---------------------------------------------------------
    WorkAvailability:
      type: object
      description: When and where the candidate can work, as the candidate gave it. All four answers or none.
      required: [candidate_id, timezone, work_start, work_end, hours_per_week, available_from, created_at, updated_at]
      properties:
        candidate_id: { $ref: "#/components/schemas/Id" }
        timezone:
          type: string
          description: IANA zone name, e.g. `America/Chicago`.
        work_start:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          description: Start of the candidate's working hours, in their own time zone.
        work_end:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          description: End of the working hours. At or before `work_start` means they run past midnight.
        hours_per_week: { type: integer, minimum: 1, maximum: 80 }
        available_from:
          allOf: [{ $ref: "#/components/schemas/CalendarDate" }]
          description: The earliest day the candidate can start.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkAvailabilityInput:
      type: object
      description: Body for `PUT …/availability`. Every field is required; they are optional on the wire so a missing one is a 422 naming it.
      properties:
        timezone: { type: string }
        work_start: { $ref: "#/components/schemas/ClockTime" }
        work_end: { $ref: "#/components/schemas/ClockTime" }
        hours_per_week: { type: integer, minimum: 1, maximum: 80 }
        available_from: { $ref: "#/components/schemas/CalendarDate" }

    AvailabilityCheck:
      type: object
      description: One candidate against one role's availability and time-zone filters.
      required: [candidate_id, candidate_name, passed, reasons, overlap_hours]
      properties:
        candidate_id: { $ref: "#/components/schemas/Id" }
        candidate_name: { type: string }
        passed: { type: boolean }
        reasons:
          type: array
          description: Why the candidate does not pass, in words; empty when they do.
          items: { type: string }
        overlap_hours:
          type: number
          format: double
          nullable: true
          description: Hours of the role's working day the candidate's working hours cover; null when the role has no time zone or the candidate no availability.

    # -- hard filters ---------------------------------------------------------
    FilterName:
      type: string
      description: A hard filter, in the order they are applied.
      enum: [profile, certifications, software, experience, availability, timezone_overlap]
    FilterStage:
      type: object
      description: One filter of a run and what it did to the pool.
      required: [filter, remaining, excluded]
      properties:
        filter: { $ref: "#/components/schemas/FilterName" }
        remaining:
          type: integer
          description: Candidates still in after this filter.
        excluded:
          type: integer
          description: Candidates this filter dropped, of those who reached it.
    RetrievedCandidate:
      type: object
      description: One candidate of a run's shortlist.
      required: [candidate_id, similarity]
      properties:
        candidate_id: { $ref: "#/components/schemas/Id" }
        similarity:
          type: number
          format: double
          description: Cosine similarity of the profile's embedding to the role's; 1 is the same direction.
    FilterRun:
      type: object
      description: One run of a role's hard filters over the active candidates, and the shortlist retrieved from those who passed.
      required:
        [id, role_id, overlap_on, pool, stages, passed, top_filter, candidate_ids, retrieval_limit, retrieved,
         unranked_ids, role_embedded, matched_at, match_status, attention_reason, attention_detail, min_score,
         qualified, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        role_id: { $ref: "#/components/schemas/Id" }
        overlap_on:
          allOf: [{ $ref: "#/components/schemas/CalendarDate" }]
          description: The day the time-zone overlap was worked out for; the role's `starts_on`, or the day of the run when it has none.
        pool:
          type: integer
          description: Active candidates when the run started.
        stages:
          type: array
          description: Every filter, in the order applied; each `remaining` is at most the one before it.
          items: { $ref: "#/components/schemas/FilterStage" }
        passed:
          type: integer
          description: Candidates left after the last filter; the length of `candidate_ids`.
        top_filter:
          allOf: [{ $ref: "#/components/schemas/FilterStage" }]
          nullable: true
          description: >-
            The must-have that eliminated the most candidates: of the filters after `profile`, the one with the
            largest `excluded` (the earliest applied, when two tie). `null` when none of them excluded anybody.
            Filters are applied in order, so each count is of the candidates who got that far.
        candidate_ids:
          type: array
          description: Who passed every filter, by name. A record of the run; a candidate deleted since stays listed.
          items: { $ref: "#/components/schemas/Id" }
        retrieval_limit:
          type: integer
          description: >-
            The most candidates the run could retrieve (`MATCH_RETRIEVAL_SIZE` when it ran). 0 on a run recorded
            before retrieval existed, which retrieved nothing.
        retrieved:
          type: array
          description: >-
            The shortlist: of those who passed, the most similar to the role, most similar first, at most
            `retrieval_limit`. Every entry is in `candidate_ids`.
          items: { $ref: "#/components/schemas/RetrievedCandidate" }
        unranked_ids:
          type: array
          description: >-
            Who passed but could not be compared, by name: their profile or the role had no usable embedding, or
            the two were embedded by different providers. None of them is in `retrieved`.
          items: { $ref: "#/components/schemas/Id" }
        role_embedded:
          type: boolean
          description: >-
            Whether the role had an embedding to compare with. When false, everyone who passed is in
            `unranked_ids`: the run is not ready, not empty.
        matched_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When a `match_role` job reranked this run's shortlist and wrote it to the role's matches. `null` for
            a run of the filters alone, or one whose rerank did not finish.
        match_status:
          allOf: [{ $ref: "#/components/schemas/RunStatus" }]
          nullable: true
          description: >-
            How the `match_role` job that made this run ended. `null` for a run of the filters alone, or one that
            never reached an outcome: the worker stopped, or some of those who passed were still being embedded
            and too few of the rest qualified, which is for the run queued behind it to say.
        attention_reason:
          allOf: [{ $ref: "#/components/schemas/AttentionReason" }]
          nullable: true
          description: Why the run needs attention; `null` unless `match_status` is `needs_attention`.
        attention_detail:
          type: string
          nullable: true
          description: The AI service's error when `attention_reason` is `ai_failed`; otherwise `null`.
        min_score:
          type: number
          format: double
          nullable: true
          description: >-
            The minimum score the run applied (`MATCH_MIN_SCORE` when it ran): a candidate scoring below it is
            never put in the review queue. `null` when the run scored nobody.
        qualified:
          type: integer
          nullable: true
          description: >-
            How many of the run's ranking can be put forward: those who scored at or above `min_score`, not
            counting a candidate deleted since or one whose match ops rejected or swapped out. `null` when the
            run scored nobody.
        created_at: { type: string, format: date-time }
    RunStatus:
      type: string
      description: >-
        How a matching run ended. `matched`: at least two candidates passed the hard filters and scored at or
        above the minimum. `needs_attention`: the run could not deliver two profiles (see `AttentionReason`).
      enum: [matched, needs_attention]
    AttentionReason:
      type: string
      description: >-
        Why a matching run needs attention. `too_few_passed`: zero or one candidate passed the hard filters.
        `too_few_qualified`: fewer than two of the reranked scored at or above the minimum. `ai_failed`: the AI
        service failed or timed out during the rerank, and no matches were written. When more than one applies,
        `ai_failed` is reported first, then `too_few_passed`.
      enum: [too_few_passed, too_few_qualified, ai_failed]
    RoleMatchState:
      type: string
      description: >-
        Where a role's matching stands. `ready`: at least two matches are released. `needs_attention` (ops
        only): not ready, and the latest matching run could not deliver two profiles. `in_review`: anything else,
        and all an employer is told until the role is `ready`.
      enum: [in_review, needs_attention, ready]
    RoleMatchStatus:
      type: object
      description: Where a role's matching stands, as the caller may see it.
      required: [role_id, status, released, run]
      properties:
        role_id: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/RoleMatchState" }
        released:
          type: integer
          description: Matches released to the employer.
        run:
          allOf: [{ $ref: "#/components/schemas/FilterRun" }]
          nullable: true
          description: >-
            The latest matching run with an outcome: its `attention_reason`, the funnel and `top_filter`. Always
            `null` for an employer, and for ops when no run has finished.

    # -- roles ----------------------------------------------------------------
    Role:
      type: object
      required:
        [id, title, company, description, requirements, must_haves, nice_to_haves, required_certifications,
         required_software, min_years_experience, timezone, min_overlap_hours, hours_per_week, starts_on, status,
         embedding_model, embedded_at, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        company: { type: string, nullable: true }
        description:
          type: string
          description: The raw job description.
        requirements:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          description: The parser's structured extraction (the AI service's `RoleRequirements`).
        must_haves:
          type: array
          items: { type: string }
        nice_to_haves:
          type: array
          items: { type: string }
        required_certifications:
          type: array
          description: Canonical taxonomy ids.
          items: { type: string }
        required_software:
          type: array
          description: Canonical taxonomy ids.
          items: { type: string }
        min_years_experience:
          type: integer
          nullable: true
          minimum: 0
          maximum: 70
          description: Fewest years of experience the role accepts; `null` when the JD gives no number (a `0` sent in is stored as `null`).
        timezone:
          type: string
          nullable: true
          description: IANA zone the role operates in. Its working day is 09:00 to 17:00 there.
        min_overlap_hours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 8
          description: Hours of the role's working day a candidate's working hours must cover; `null` when the role does not ask.
        hours_per_week:
          type: integer
          nullable: true
          minimum: 1
          maximum: 80
          description: Hours a week the role needs; a candidate must offer at least as many. `null` when the role does not ask.
        starts_on:
          allOf: [{ $ref: "#/components/schemas/CalendarDate" }]
          nullable: true
        status: { $ref: "#/components/schemas/RoleStatus" }
        embedding_model: { type: string, nullable: true }
        embedded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoleInput:
      type: object
      description: |
        Body for creating or updating a role. Every field is optional on the
        wire so a `PUT` can send only what changes; `title` is required when
        creating and may not be nulled.
      properties:
        title: { type: string }
        company: { type: string, nullable: true }
        description:
          type: string
          nullable: true
          description: "`null` clears it to an empty string."
        requirements:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          x-go-type-skip-optional-pointer: true
        must_haves:
          type: array
          items: { type: string }
          x-go-type-skip-optional-pointer: true
        nice_to_haves:
          type: array
          items: { type: string }
          x-go-type-skip-optional-pointer: true
        required_certifications:
          type: array
          items: { type: string }
          x-go-type-skip-optional-pointer: true
        required_software:
          type: array
          items: { type: string }
          x-go-type-skip-optional-pointer: true
        min_years_experience: { type: integer, nullable: true, minimum: 0, maximum: 70 }
        timezone: { type: string, nullable: true }
        min_overlap_hours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 8
          description: Needs `timezone`. Supply it at intake when the JD does not state it; a `0` is stored as `null`.
        hours_per_week:
          type: integer
          nullable: true
          minimum: 0
          maximum: 80
          description: Supply it at intake when the JD does not state it; a `0` is stored as `null`.
        starts_on:
          allOf: [{ $ref: "#/components/schemas/CalendarDate" }]
          nullable: true
        status:
          allOf: [{ $ref: "#/components/schemas/RoleStatus" }]
          description: Defaults to `open` on create.

    RoleIntakeInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          description: The job description as pasted, up to 60,000 characters.
        title:
          type: string
          nullable: true
          description: Overrides the title the parser finds; required when the job description names none.
        company:
          type: string
          nullable: true
          description: Overrides the company the parser finds.

    RoleIntake:
      type: object
      required: [role, matching_job]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        matching_job:
          allOf: [{ $ref: "#/components/schemas/Job" }]
          description: The `match_role` job queued for the role.

    # -- matches --------------------------------------------------------------
    Match:
      type: object
      required:
        [id, role_id, candidate_id, score, explanation, breakdown, status, released_at, created_at, updated_at,
         role_title, candidate_name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        role_id: { $ref: "#/components/schemas/Id" }
        candidate_id: { $ref: "#/components/schemas/Id" }
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        explanation: { type: string }
        breakdown:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          description: >-
            Scoring detail. On a match a `match_role` job wrote: `filter_run_id` (the run it came from), `rank`
            (the candidate's place in that run's ranking, 1 first), `similarity` (embedding similarity to the
            role), `rubric_version`, `provider`, `reasons`, and `dimensions`: for each dimension of the rerank
            rubric the `level` (0 to 4, or null), a sentence of `evidence` and the `quotes` from the candidate's
            text that back it.
        status: { $ref: "#/components/schemas/MatchStatus" }
        released_at:
          type: string
          format: date-time
          nullable: true
          description: Set when ops released the match to the employer (`POST /roles/{id}/release`).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        role_title:
          type: string
          description: Denormalised from the role so a shortlist needs one request.
        candidate_name:
          type: string
          description: Denormalised from the candidate.

    MatchUpdate:
      type: object
      description: >-
        The ops-editable part of a match. Fields not sent keep their value. `status` is not one of them: it
        changes through the review operations.
      properties:
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        explanation:
          type: string
          nullable: true
          description: "`null` clears it to an empty string."
        breakdown:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          x-go-type-skip-optional-pointer: true

    MatchCreate:
      type: object
      required: [role_id, candidate_id, score]
      properties:
        role_id: { $ref: "#/components/schemas/Id" }
        candidate_id: { $ref: "#/components/schemas/Id" }
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        explanation: { type: string, nullable: true }
        breakdown:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          x-go-type-skip-optional-pointer: true
        status:
          allOf: [{ $ref: "#/components/schemas/MatchStatus" }]
          description: "`proposed` (the default) or `pending_review`."

    # -- review ---------------------------------------------------------------
    ReviewInput:
      type: object
      properties:
        reason:
          type: string
          description: Recorded on the review event.

    ReviewQueue:
      type: object
      description: A role's matches under review.
      required: [role_id, pending, approved, next]
      properties:
        role_id: { $ref: "#/components/schemas/Id" }
        pending:
          type: array
          description: The queue, the `pending_review` matches waiting for a decision, best first.
          items: { $ref: "#/components/schemas/Match" }
        approved:
          type: array
          description: >-
            The `approved` matches, best first. The role can be released when there are exactly two;
            `released_at` says whether each has been.
          items: { $ref: "#/components/schemas/Match" }
        next:
          allOf: [{ $ref: "#/components/schemas/Match" }]
          nullable: true
          description: >-
            The next ranked candidate, whom a swap would bring into the queue. `null` when nobody in reserve
            scores the minimum or more.

    SwapResult:
      type: object
      required: [swapped, replacement]
      properties:
        swapped:
          allOf: [{ $ref: "#/components/schemas/Match" }]
          description: The match taken out, now `swapped`.
        replacement:
          allOf: [{ $ref: "#/components/schemas/Match" }]
          description: The next ranked match, now `pending_review`.

    ReviewAction:
      type: string
      description: What a review event records. Each is written by the review operation of the same name.
      enum: [approve, reject, swap, release, unrelease]

    ReviewEvent:
      type: object
      description: One ops decision on a match, as recorded when it was made.
      required:
        [id, match_id, role_id, candidate_id, candidate_name, action, actor, reason, replacement_candidate_id,
         replacement_candidate_name, metadata, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Events are numbered in the order they were recorded.
        match_id: { $ref: "#/components/schemas/Id" }
        role_id: { $ref: "#/components/schemas/Id" }
        candidate_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: The candidate of the match the decision was on.
        candidate_name: { type: string }
        action: { $ref: "#/components/schemas/ReviewAction" }
        actor:
          type: string
          description: Who did it, the `X-Actor` of the request.
        reason: { type: string, nullable: true }
        replacement_candidate_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          nullable: true
          description: For a `swap`, the candidate brought into the queue.
        replacement_candidate_name: { type: string, nullable: true }
        metadata:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          description: >-
            `from`, the status the match had before an approve, reject or swap; for a swap also
            `replacement_match_id`.
        created_at: { type: string, format: date-time }

    # -- jobs -----------------------------------------------------------------
    Job:
      type: object
      description: |
        One background job in the Postgres-backed queue (the `jobs` table). A
        worker claims a `queued` job whose `run_at` has passed, runs the handler
        for its `kind`, and marks it `succeeded`. A failing attempt puts it back
        to `queued` with `run_at` pushed out by a backoff until `attempts`
        reaches `max_attempts`, when it lands in `failed` with `last_error` set.
      required:
        [id, kind, payload, status, priority, run_at, attempts, max_attempts, last_error, worker, started_at,
         finished_at, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/JobId" }
        kind:
          type: string
          description: Names the handler that runs it, e.g. `embed_role`, `parse_resume` or `match_role`.
        payload:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          description: 'Handler-specific input, e.g. `{"role_id": "…"}`.'
        status: { $ref: "#/components/schemas/JobStatus" }
        priority:
          type: integer
          description: Higher runs first.
        run_at:
          type: string
          format: date-time
          description: Not before this time. Retry backoff pushes it into the future.
        attempts:
          type: integer
          description: Claims so far, including one in progress.
        max_attempts:
          type: integer
          minimum: 1
        last_error:
          type: string
          nullable: true
          description: The most recent failed attempt's error; kept on a `failed` job, cleared on success.
        worker:
          type: string
          nullable: true
          description: Id of the worker that last claimed it.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the current or most recent attempt was claimed.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the job reached `succeeded` or `failed`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Must be a kind the worker has a handler for; otherwise a 422 naming the known kinds.
          example: embed_role
        payload:
          allOf: [{ $ref: "#/components/schemas/JSONObject" }]
          x-go-type-skip-optional-pointer: true
        priority:
          type: integer
          minimum: -32768
          maximum: 32767
          description: Defaults to 0. Higher runs first.
        run_at:
          type: string
          format: date-time
          description: Delay the job until this time. Defaults to now.
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          description: Defaults to 3.
